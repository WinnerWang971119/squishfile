name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          pip install .
          pip install pyinstaller

      - name: Verify resolved version matches tag (EXE)
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BUILT=$(python -c "import squishfile; print(squishfile.__version__)")
          echo "tag=$TAG resolved=$BUILT"
          if [ "$TAG" != "$BUILT" ]; then
            echo "::error::EXE build resolved version $BUILT != tag $TAG"; exit 1
          fi

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build EXE with PyInstaller
        run: pyinstaller squishfile.spec --noconfirm

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: SquishFile-windows
          path: dist/SquishFile.exe

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build package
        run: |
          pip install build twine
          python -m build --wheel

      - name: Verify built version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          WHEEL=$(ls dist/*.whl)
          BUILT=$(basename "$WHEEL" | sed -E 's/^squishfile-([^-]+)-.*/\1/')
          echo "tag=$TAG built=$BUILT"
          if [ "$TAG" != "$BUILT" ]; then
            echo "::error::Built version $BUILT does not match tag $TAG"; exit 1
          fi

      - name: Verify wheel bundles frontend
        run: |
          python -m zipfile -l dist/*.whl | grep -q "squishfile/frontend/dist/index.html" \
            || { echo "::error::wheel is missing squishfile/frontend/dist"; exit 1; }

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*

  create-release:
    name: Create GitHub Release
    needs: build-exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: SquishFile-windows
          path: ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/SquishFile.exe
          generate_release_notes: true
